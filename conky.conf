conky.config = {
    alignment = 'top_right',
    background = false,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'bbbbbb',
    default_outline_color = 'white',
    default_shade_color = 'black',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = true,
    use_xft = true,
    font = 'DejaVu Sans Mono:size=10',
    gap_x = 30,
    gap_y = 60,
    minimum_height = 5,
    maximum_width = 380,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    extra_newline = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 160,
    own_window_colour = '1a1a1a',
    stippled_borders = 0,
    update_interval = 2.0,
    uppercase = false,
    use_spacer = 'none',
    show_graph_scale = false,
    show_graph_range = false,

    -- palette
    color1 = 'cc6644',   -- section headers (burnt orange)
    color2 = '888888',   -- secondary
    color3 = '333333',   -- dividers
    color4 = 'cccccc',   -- labels
    color5 = '55aa66',   -- positive / green
    color6 = 'cc4444',   -- negative / red
    color7 = 'ffaa00',   -- accent / warning
    color8 = '4488cc',   -- info blue
}

conky.text = [[
${color1}${font DejaVu Sans:bold:size=11}PORTFOLIO${font}${color}
${color3}${hr 1}${color}
${color4}Total   ${color}${alignr}${color4}${execi 300 python3 ~/.config/conky/portfolio.py total}${color}
${color4}P&L     ${color}${alignr}${execi 300 python3 ~/.config/conky/portfolio.py pnl}${color}
${color4}Cash    ${color}${alignr}${color4}${execi 300 python3 ~/.config/conky/portfolio.py cash}${color}
${color4}Pos     ${color}${alignr}${color2}${execi 300 python3 ~/.config/conky/portfolio.py positions}${color}

${color2}${execi 300 python3 ~/.config/conky/portfolio.py summary}${color}

${color1}${font DejaVu Sans:bold:size=11}SYSTEM${font}${color}
${color3}${hr 1}${color}
${color4}Host    ${color}${alignr}${color2}$nodename${color}
${color4}Up      ${color}${alignr}${color2}$uptime_short${color}
${color4}Load    ${color}${alignr}${color2}${loadavg 1}${color}
${color4}Top     ${color}${alignr}${color2}${top name 1} ${top cpu 1}%${color}

${color1}${font DejaVu Sans:bold:size=11}DOCKER${font}${color}
${color3}${hr 1}${color}
${if_running dockerd}${color4}Running ${color}${alignr}${color2}${execi 30 docker ps -q | wc -l} containers${color}
${color2}${execi 30 docker ps --format "{{.Names}}" | head -5 | sed 's/^/• /' | tr '\n' ' ' | fold -w 38}${color}${else}${color2}Docker not running${color}${endif}


${color1}${font DejaVu Sans:bold:size=11}HARDWARE${font}${color}
${color3}${hr 1}${color}
${color4}CPU     ${color}${alignr}${color2}${cpu}%  ${hwmon 0 temp 1}°C${color}
${color4}GPU     ${color}${alignr}${color2}${execi 10 nvidia-smi --query-gpu=utilization.gpu,temperature.gpu --format=csv,noheader,nounits | awk -F', ' '{print $1"% "$2"°C"}'}${color}
${color4}RAM     ${color}${alignr}${color2}${mem} / ${memmax}  ($memperc%)${color}
${color4}Disk    ${color}${alignr}${color2}${fs_used /} / ${fs_size /}  (${fs_used_perc /}%)${color}

${color1}${font DejaVu Sans:bold:size=11}WORLD${font}${color}
${color3}${hr 1}${color}
${color4}London  ${color}${alignr}${color2}${execi 1800 curl -s "wttr.in/London?format=%t+%C&m" | tr '+' ' '}${color}
${color4}Sun     ${color}${alignr}${color2}${execi 3600 /home/picxi/.config/.venv/bin/python ~/.config/conky/sun_moon.py all}${color}
${color4}Moon    ${color}${alignr}${color2}${execi 3600 /home/picxi/.config/.venv/bin/python ~/.config/conky/sun_moon.py moon}${color}
${color4}GBP/USD ${color}${alignr}${color2}${execi 600 curl -s "https://api.exchangerate-api.com/v4/latest/GBP" | python3 -c "import sys,json; data=json.load(sys.stdin); print(f'\${data[\"rates\"][\"USD\"]:.3f}')" 2>/dev/null || echo "N/A"}${color}

${color3}${hr 1}${color}
${color1}${alignc}${time %H:%M:%S} — ${time %d/%m/%Y}${color}
]]